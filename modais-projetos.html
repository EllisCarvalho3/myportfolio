<!-- Modal Carrossel de Projetos -->
<div id="carousel-modal" class="carousel-modal">
    <span class="carousel-close">&times;</span>

    <div class="carousel-content">
        <span class="carousel-prev">&#10094;</span>
        <img id="carousel-image" src="" alt="Imagem do projeto">
        <span class="carousel-next">&#10095;</span>
    </div>

    <div id="carousel-dots" class="carousel-dots"></div>

    <p id="carousel-description" class="carousel-description"></p>
</div>

</div>
